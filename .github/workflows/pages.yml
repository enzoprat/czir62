# Preview de recette sur GitHub Pages.
#
# Le site cible czir62.fr a la racine d'un domaine ; Pages le sert sous
# /czir62/. La reecriture est faite apres le build par scripts/pages-rebase.mjs
# et ne touche que dist/ — la configuration Astro reste celle de la production.
#
# Limite assumee : /api/lead/ est une route serveur. Pages ne sert que du
# statique, le formulaire de devis renverra donc une erreur reseau sur cette
# preview. Le tunnel complet demande un hebergeur Node.
name: Preview GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Republier sous /czir62/
        run: node scripts/pages-rebase.mjs dist/client /czir62

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
